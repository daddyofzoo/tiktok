<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>TikTok Money | Saques</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --tt-red: #FE2C55;
      --tt-red2: #ff4d6d;
      --tt-blue: #25F4EE;
      --tt-white: #FFFFFF;
      --tt-black: #000000;
      --tt-gray: #111111;
      --tt-gray2: #1a1a1a;
      --tt-gray3: #252525;
      --tt-gray4: #333333;
      --tt-muted: #7a7a7a;
      --tt-border: rgba(255,255,255,0.07);
      --tt-border2: rgba(255,255,255,0.12);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    body {
      background: var(--tt-black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      padding: 18px;
    }

    /* ── TOPBAR ── */
    .tt-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(52px + var(--safe-t));
      padding-top: var(--safe-t);
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 100;
      border-bottom: 1px solid var(--tt-border);
    }

    .tt-logo {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .tt-logo-icon {
      width: 26px; height: 26px;
      position: relative;
      margin-right: 2px;
    }
    .tt-logo-icon::before {
      content: '';
      position: absolute;
      inset: 1px;
      background: var(--tt-blue);
      border-radius: 5px;
      transform: translate(2px, 2px);
      opacity: 0.7;
    }
    .tt-logo-icon::after {
      content: '';
      position: absolute;
      inset: 1px;
      background: var(--tt-red);
      border-radius: 5px;
      transform: translate(-2px, -2px);
      opacity: 0.7;
    }
    .tt-logo-icon i {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      z-index: 1;
    }

    .tt-logo .r { color: var(--tt-red); }
    .tt-logo .b { color: var(--tt-blue); text-shadow: -2px 0 var(--tt-red); }
    .tt-logo .m { color: var(--tt-muted); font-size: 11px; font-weight: 600; margin-left: 1px; }

    /* ── BOTTOM NAV ── */
    .tt-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(54px + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--tt-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-i {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
      padding: 6px 0;
      opacity: 0.45;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--tt-white);
    }
    .nav-i.on { opacity: 1; }
    .nav-i i { font-size: 20px; }

    .nav-plus-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .nav-plus {
      width: 46px; height: 28px;
      border-radius: 7px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .nav-plus::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, var(--tt-blue) 50%, var(--tt-red) 50%);
    }
    .nav-plus::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--tt-white);
      border-radius: 5px;
    }
    .nav-plus i { position: relative; z-index: 1; color: var(--tt-black); font-size: 16px; font-weight: 900; }

    .container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
      margin-top: calc(52px + var(--safe-t));
      margin-bottom: calc(54px + var(--safe-b));
    }

    .card {
      background: var(--tt-gray2);
      border: 1px solid var(--tt-border);
      border-radius: 14px;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      animation: slideIn .4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .logo .r { color: var(--tt-red); }
    .logo .b { color: var(--tt-blue); }
    .logo .m { color: var(--tt-muted); font-size: 11px; }

    .back-button {
      background: var(--tt-gray3);
      border: 1px solid var(--tt-border);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .back-button:hover {
      background: var(--tt-gray4);
      transform: translateX(-3px);
    }

    h1 {
      color: var(--tt-white);
      margin-bottom: 12px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h2 {
      color: var(--tt-white);
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    h3 {
      color: var(--tt-muted);
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
    }

    .description {
      color: var(--tt-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      background: var(--tt-red);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:active { transform: scale(0.98); filter: brightness(0.88); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-success {
      background: var(--tt-red);
    }

    .btn-secondary {
      margin-top: 12px;
      background: var(--tt-gray3);
      color: var(--tt-muted);
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* Payment Methods */
    .payment-methods {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      color: white;
    }

    .payment-method {
      flex: 1;
      background: var(--tt-gray2);
      border: 1.5px solid var(--tt-border);
      border-radius: 12px;
      padding: 16px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .payment-method:hover { background: var(--tt-gray3); }
    .payment-method.selected { border-color: var(--tt-red); background: rgba(254,44,85,0.07); }
    .payment-method i { font-size: 36px; margin-bottom: 8px; display: block; }
    .payment-method.selected i { color: var(--tt-red); }
    .payment-method span { font-size: 13px; font-weight: 700; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--tt-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      background: var(--tt-gray3);
      border: 1px solid var(--tt-border);
      border-radius: 8px;
      font-size: 14px;
      color: white;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--tt-red);
    }

    .form-group input::placeholder {
      color: var(--tt-muted);
    }

    .saldo {
      background: var(--tt-gray3);
      border: 1px solid var(--tt-border);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      text-align: center;
    }

    .saldo h3 {
      margin-bottom: 8px;
    }

    .saldo .valor {
      font-size: 42px;
      font-weight: 800;
      color: var(--tt-red);
    }

    /* Processing */
    .processing {
      text-align: center;
      padding: 40px 0;
    }

    .processing-spinner {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      border: 3px solid var(--tt-gray3);
      border-top-color: var(--tt-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-text {
      color: var(--tt-red);
      font-size: 16px;
      font-weight: 700;
    }

    /* Detalhes */
    .saque-detalhes {
      background: var(--tt-gray3);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
    }

    .detalhe-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--tt-border);
    }

    .detalhe-item:last-child { border-bottom: none; }

    .detalhe-icon {
      width: 40px;
      height: 40px;
      background: var(--tt-gray2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detalhe-label {
      color: var(--tt-muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .detalhe-value {
      color: var(--tt-white);
      font-size: 16px;
      font-weight: 700;
    }

    .detalhe-value.highlight {
      color: var(--tt-red);
      font-size: 20px;
    }

    .tiny-link-wrap {
      text-align: center;
      margin: 16px 0;
    }

    .tiny-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--tt-gray3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--tt-muted);
    }

    .tiny-link:hover { color: var(--tt-red); }

    .waiting-message {
      background: rgba(254,44,85,0.08);
      border: 1px solid rgba(254,44,85,0.2);
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--tt-red);
      margin: 16px 0;
    }

    .timer-box {
      margin-top: 16px;
      padding: 16px;
      background: var(--tt-gray3);
      border-radius: 12px;
      text-align: center;
    }

    .timer-title {
      color: var(--tt-muted);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .timer-item {
      background: var(--tt-gray2);
      border: 1px solid var(--tt-border);
      border-radius: 10px;
      padding: 10px;
    }

    .timer-number {
      font-size: 22px;
      font-weight: 800;
      color: var(--tt-red);
    }

    .timer-label {
      font-size: 10px;
      color: var(--tt-muted);
    }

    .blocked {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      padding: 12px;
      border-radius: 10px;
      color: #ef4444;
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
    }

    /* Popup */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .popup-overlay.show { display: flex; }

    .popup-card {
      width: 90%;
      max-width: 400px;
      background: var(--tt-gray2);
      border: 1px solid var(--tt-border);
      border-radius: 20px;
      padding: 24px 20px;
      position: relative;
      animation: slideIn 0.3s ease;
    }

    .popup-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--tt-gray3);
      border: none;
      color: white;
      cursor: pointer;
    }

    .popup-title {
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      color: var(--tt-red);
      margin-bottom: 16px;
    }

    @media (max-width: 480px) {
      .container { padding: 0 10px; }
      .card { padding: 20px 16px; }
      h1 { font-size: 32px; }
      h2 { font-size: 22px; }
      .saldo .valor { font-size: 34px; }
      .timer-grid { gap: 6px; }
      .timer-number { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="tt-topbar">
    <div class="tt-logo">
      <div class="tt-logo-icon"><i class="fab fa-tiktok"></i></div>
      <span class="r">Tik</span><span class="b">Tok</span>
      <span class="m">Money</span>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="tt-nav">
    <div class="nav-i on">
      <i class="fas fa-home"></i>
      <span>Início</span>
    </div>
    <div class="nav-i">
      <i class="fas fa-search"></i>
      <span>Descobrir</span>
    </div>
    <div class="nav-plus-wrap">
      <div class="nav-plus"><i class="fas fa-plus"></i></div>
    </div>
    <div class="nav-i">
      <i class="fas fa-comment-dots"></i>
      <span>Inbox</span>
    </div>
    <div class="nav-i">
      <i class="fas fa-user"></i>
      <span>Perfil</span>
    </div>
  </div>

  <div class="container" id="app"></div>

  <div class="popup-overlay" id="detailsPopup">
    <div class="popup-card">
      <button class="popup-close" onclick="closePopup()"><i class="fas fa-times"></i></button>
      <div class="popup-title"><i class="fas fa-receipt"></i> DETALHES DO SAQUE</div>
      <div id="popupDetails"></div>
      <div class="timer-box">
        <div class="timer-title"><i class="fas fa-clock"></i> Receberá o valor em:</div>
        <div class="timer-grid">
          <div class="timer-item"><div class="timer-number" id="popupDays">00</div><div class="timer-label">Dias</div></div>
          <div class="timer-item"><div class="timer-number" id="popupHours">00</div><div class="timer-label">Horas</div></div>
          <div class="timer-item"><div class="timer-number" id="popupMinutes">00</div><div class="timer-label">Min</div></div>
          <div class="timer-item"><div class="timer-number" id="popupSeconds">00</div><div class="timer-label">Seg</div></div>
        </div>
        <div id="popupBlockedBox"></div>
      </div>
    </div>
  </div>

  <script>
    let currentScreen = 'welcome';
    let selectedMethod = null;
    let formData = { numero: '', nome: '', valorSaque: null };

    // VALOR CORRETO: 8.764 METICAIS
    const SALDO_DISPONIVEL = 8764;
    const APP_KEY = 'tiktok_saque_estado_v1';
    const TIMER_DURATION_MS = 14 * 24 * 60 * 60 * 1000;

    const app = document.getElementById('app');
    let state = loadState();

    function getInitialState() {
      return {
        saqueRealizado: false,
        selectedMethod: null,
        formData: { numero: '', nome: '', valorSaque: null },
        timerStartedAt: null,
        timerEndsAt: null,
        saqueBloqueado: false
      };
    }

    function loadState() {
      const saved = localStorage.getItem(APP_KEY);
      if (!saved) return getInitialState();
      try {
        const parsed = JSON.parse(saved);
        return { ...getInitialState(), ...parsed, formData: { ...getInitialState().formData, ...(parsed.formData || {}) } };
      } catch { return getInitialState(); }
    }

    function saveState() { localStorage.setItem(APP_KEY, JSON.stringify(state)); }

    function formatCurrency(value) {
      return value.toLocaleString('pt-MZ', { style: 'currency', currency: 'MZN', minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function escapeHtml(text) { return String(text ?? '').replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

    function methodLabel(method) { return method === 'mpesa' ? 'M-PESA' : 'E-MOLA'; }

    function getRemainingMs() { return state.timerEndsAt ? Math.max(0, state.timerEndsAt - Date.now()) : 0; }

    function getTimerParts() {
      const remaining = getRemainingMs();
      const totalSeconds = Math.floor(remaining / 1000);
      return { remaining, days: Math.floor(totalSeconds / (24 * 60 * 60)), hours: Math.floor((totalSeconds % (24 * 60 * 60)) / 3600), minutes: Math.floor((totalSeconds % 3600) / 60), seconds: totalSeconds % 60 };
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function checkBlockedStatus() {
      if (state.timerEndsAt && Date.now() >= state.timerEndsAt && !state.saqueBloqueado) {
        state.saqueBloqueado = true;
        saveState();
      }
    }

    function renderScreen() {
      checkBlockedStatus();
      selectedMethod = state.selectedMethod;
      formData = { ...state.formData };

      if (state.saqueRealizado) { renderSaqueRealizado(); startTimerLoop(); return; }

      if (currentScreen === 'welcome') renderWelcome();
      else if (currentScreen === 'payment') renderPayment();
      else if (currentScreen === 'amount') renderAmount();
      else if (currentScreen === 'processing') renderProcessing();
      else if (currentScreen === 'success') { renderSuccess(); startTimerLoop(); }
    }

    function renderWelcome() {
      app.innerHTML = `
        <div class="card">
          <div class="nav-header"><div class="logo"><span class="r">Tik</span><span class="b">Tok</span> <span class="m">Money</span></div></div>
          <h3><i class="fas fa-wallet"></i> Saldo disponível:</h3>
          <h1>${formatCurrency(SALDO_DISPONIVEL)}</h1>
          <p class="description">Realize o saque de todos seus ganhos obtidos nas pesquisas do TikTok Money Moçambique!</p>
          <button class="btn" onclick="nextScreen('payment')"><i class="fas fa-money-bill-wave"></i> Levantar meu Saldo</button>
        </div>
      `;
    }

    function renderPayment() {
      app.innerHTML = `
        <div class="card">
          <div class="back-button" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
          <h2><i class="fas fa-credit-card"></i> Escolha o método</h2>
          <div class="payment-methods">
            <div class="payment-method ${selectedMethod === 'mpesa' ? 'selected' : ''}" onclick="selectMethod('mpesa', event)"><i class="fas fa-mobile-alt"></i><span>M-PESA</span></div>
            <div class="payment-method ${selectedMethod === 'emola' ? 'selected' : ''}" onclick="selectMethod('emola', event)"><i class="fas fa-university"></i><span>E-MOLA</span></div>
          </div>
          <div id="formContainer" class="form-container">
            ${selectedMethod ? `
              <div class="form-group"><label><i class="fas fa-phone"></i> Número de telefone</label><input type="tel" id="numero" placeholder="Digite o número" value="${escapeHtml(formData.numero)}" oninput="updateForm('numero', this.value)"></div>
              <div class="form-group"><label><i class="fas fa-user"></i> Nome do titular</label><input type="text" id="nome" placeholder="Digite o nome completo" value="${escapeHtml(formData.nome)}" oninput="updateForm('nome', this.value)"></div>
            ` : ''}
          </div>
          <button class="btn" onclick="nextScreen('amount')" ${!selectedMethod || !formData.numero || !formData.nome ? 'disabled' : ''}><i class="fas fa-arrow-right"></i> Continuar</button>
        </div>
      `;
    }

    function renderAmount() {
      app.innerHTML = `
        <div class="card">
          <div class="back-button" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
          <h2><i class="fas fa-coins"></i> Quanto deseja retirar?</h2>
          <div class="saldo"><h3><i class="fas fa-chart-line"></i> Saldo disponível</h3><div class="valor">${formatCurrency(SALDO_DISPONIVEL)}</div></div>
          <div class="form-group"><label><i class="fas fa-dollar-sign"></i> Valor do saque</label><input type="number" id="valorSaque" placeholder="Digite o valor" min="1" max="${SALDO_DISPONIVEL}" value="${formData.valorSaque ?? ''}" oninput="validateAmount(this.value)"></div>
          <button class="btn" id="saqueBtn" onclick="startProcessing()" ${!(formData.valorSaque > 0 && formData.valorSaque <= SALDO_DISPONIVEL) ? 'disabled' : ''}><i class="fas fa-check-circle"></i> Fazer Saque</button>
        </div>
      `;
    }

    function renderProcessing() {
      app.innerHTML = `
        <div class="card">
          <div class="processing"><div class="processing-spinner"></div></div>
        </div>
      `;
      setTimeout(() => {
        state.saqueRealizado = true;
        if (!state.timerStartedAt) { state.timerStartedAt = Date.now(); state.timerEndsAt = Date.now() + TIMER_DURATION_MS; }
        saveState();
        currentScreen = 'success';
        renderScreen();
      }, 3000);
    }

    function getDetailsHtml() {
      return `
        <div class="saque-detalhes">
          <div class="detalhe-item"><div class="detalhe-icon"><i class="fas fa-coins"></i></div><div><div class="detalhe-label">Valor retirado</div><div class="detalhe-value highlight">${formatCurrency(state.formData.valorSaque)}</div></div></div>
          <div class="detalhe-item"><div class="detalhe-icon"><i class="fas fa-credit-card"></i></div><div><div class="detalhe-label">Carteira</div><div class="detalhe-value">${methodLabel(state.selectedMethod)}</div></div></div>
          <div class="detalhe-item"><div class="detalhe-icon"><i class="fas fa-phone"></i></div><div><div class="detalhe-label">Número</div><div class="detalhe-value">${escapeHtml(state.formData.numero || '---')}</div></div></div>
          <div class="detalhe-item"><div class="detalhe-icon"><i class="fas fa-user"></i></div><div><div class="detalhe-label">Titular</div><div class="detalhe-value">${escapeHtml(state.formData.nome || '---')}</div></div></div>
        </div>
      `;
    }

    function renderSuccess() {
      app.innerHTML = `
        <div class="card">
          <div class="nav-header"><div class="logo"><span class="r">Tik</span><span class="b">Tok</span> <span class="m">Money</span></div></div>
          <div style="text-align:center;"><i class="fas fa-check-circle" style="font-size: 60px; color: var(--tt-red); margin: 10px 0;"></i></div>
          <h2 style="text-align:center;">Saque Concluído!</h2>
          <h3 style="text-align:center;">Valor retirado: <strong style="color: var(--tt-red);">${formatCurrency(state.formData.valorSaque)}</strong></h3>
          <div class="tiny-link-wrap"><span class="tiny-link" onclick="openPopup()"><i class="fas fa-info-circle"></i> Ver detalhes do saque</span></div>
          <div class="waiting-message"><i class="fas fa-hourglass"></i> Irá receber o valor em 7 a 14 dias úteis na sua conta ${methodLabel(state.selectedMethod)}</div>
          <button class="btn btn-success" onclick="window.location.href='https://wa.me/258855387827'"><i class="fab fa-whatsapp"></i> FALAR COM O SUPORTE</button>
          <button class="btn btn-secondary"><i class="fas fa-lock"></i> ACESSAR PLATAFORMA (Indisponível)</button>
        </div>
      `;
    }

    function renderSaqueRealizado() {
      app.innerHTML = `
        <div class="card">
          <div class="nav-header"><div class="logo"><span class="r">Tik</span><span class="b">Tok</span> <span class="m">Money</span></div></div>
          <div style="text-align:center;"><i class="fas fa-lock" style="font-size: 60px; color: var(--tt-red); margin: 10px 0;"></i></div>
          <h2 style="text-align:center;">SAQUE REALIZADO</h2>
          <h3 style="text-align:center;">Valor retirado: <strong style="color: var(--tt-red);">${formatCurrency(state.formData.valorSaque)}</strong></h3>
          <div class="tiny-link-wrap"><span class="tiny-link" onclick="openPopup()"><i class="fas fa-info-circle"></i> Ver detalhes do saque</span></div>
          <div class="waiting-message"><i class="fas fa-hourglass"></i> Irá receber o valor em 7 a 14 dias úteis</div>
          <button class="btn btn-success" onclick="window.location.href='https://wa.me/258855387827'"><i class="fab fa-whatsapp"></i> FALAR COM O SUPORTE</button>
          <button class="btn btn-secondary" disabled><i class="fas fa-lock"></i> ACESSAR PLATAFORMA (Indisponível)</button>
        </div>
      `;
    }

    let timerInterval = null;

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      updateAllTimers();
      timerInterval = setInterval(() => { checkBlockedStatus(); updateAllTimers(); }, 1000);
    }

    function updateAllTimers() {
      const parts = getTimerParts();
      ['days', 'hours', 'minutes', 'seconds', 'popupDays', 'popupHours', 'popupMinutes', 'popupSeconds'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = pad(parts[id.replace('popup', '').toLowerCase()] || 0);
      });
      const popupBlockedBox = document.getElementById('popupBlockedBox');
      if (popupBlockedBox) popupBlockedBox.innerHTML = state.saqueBloqueado ? `<div class="blocked"><i class="fas fa-exclamation-triangle"></i> Saque bloqueado e conta desativada.</div>` : '';
      if (parts.remaining <= 0 && !state.saqueBloqueado) { state.saqueBloqueado = true; saveState(); if (timerInterval) clearInterval(timerInterval); }
    }

    window.nextScreen = (screen) => { currentScreen = screen; renderScreen(); };
    window.goBack = () => { currentScreen = (currentScreen === 'payment' ? 'welcome' : 'payment'); renderScreen(); };
    window.selectMethod = (method, event) => {
      state.selectedMethod = method; saveState();
      document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
      if (event && event.currentTarget) event.currentTarget.classList.add('selected');
      const formContainer = document.getElementById('formContainer');
      if (formContainer) {
        formContainer.innerHTML = `<div class="form-group"><label><i class="fas fa-phone"></i> Número de telefone</label><input type="tel" id="numero" placeholder="Digite o número" value="${escapeHtml(state.formData.numero)}" oninput="updateForm('numero', this.value)"></div><div class="form-group"><label><i class="fas fa-user"></i> Nome do titular</label><input type="text" id="nome" placeholder="Digite o nome completo" value="${escapeHtml(state.formData.nome)}" oninput="updateForm('nome', this.value)"></div>`;
      }
      const btn = document.querySelector('.btn'); if (btn) btn.disabled = !(state.selectedMethod && state.formData.numero && state.formData.nome);
    };
    window.updateForm = (field, value) => { state.formData[field] = value; saveState(); const btn = document.querySelector('.btn'); if (btn) btn.disabled = !(state.selectedMethod && state.formData.numero && state.formData.nome); };
    window.validateAmount = (value) => { const val = parseFloat(value); state.formData.valorSaque = (val && val > 0 && val <= SALDO_DISPONIVEL) ? val : null; saveState(); const btn = document.getElementById('saqueBtn'); if (btn) btn.disabled = !state.formData.valorSaque; };
    window.startProcessing = () => { currentScreen = 'processing'; renderScreen(); };
    window.openPopup = () => { document.getElementById('popupDetails').innerHTML = getDetailsHtml(); document.getElementById('detailsPopup').classList.add('show'); updateAllTimers(); };
    window.closePopup = () => { document.getElementById('detailsPopup').classList.remove('show'); };
    document.getElementById('detailsPopup').addEventListener('click', (e) => { if (e.target.id === 'detailsPopup') closePopup(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopup(); });
    renderScreen();
  </script>
</body>
</html>
